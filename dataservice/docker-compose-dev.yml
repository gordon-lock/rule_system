version: '3.8'

services:
  # Trino Coordinator (简化版)
  trino-coordinator:
    image: trinodb/trino:latest
    container_name: trino-coordinator-dev
    ports:
      - "8080:8080"
    environment:
      - TRINO_NODE_ID=coordinator
      - TRINO_NODE_ENVIRONMENT=development
      - TRINO_COORDINATOR=true
      - TRINO_DISCOVERY_URI=http://localhost:8080
    volumes:
      - ./trino-config-dev:/etc/trino
    command: ["/usr/lib/trino/bin/launcher", "run"]
    networks:
      - trino-network

  # Iceberg GraphQL API
  iceberg-graphql-api:
    build: .
    container_name: iceberg-graphql-api-dev
    ports:
      - "8081:8080"
    environment:
      - SPRING_DATASOURCE_TRINO_JDBC_URL=jdbc:trino://trino-coordinator:8080/iceberg/default
      - SPRING_DATASOURCE_TRINO_USERNAME=admin
      - SPRING_DATASOURCE_TRINO_PASSWORD=
      - TRINO_SERVER_URL=http://trino-coordinator:8080
    depends_on:
      - trino-coordinator
    networks:
      - trino-network
    restart: unless-stopped

networks:
  trino-network:
    driver: bridge 