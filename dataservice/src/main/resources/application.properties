# Quarkus Application Configuration

# Server Configuration
quarkus.http.port=8080
quarkus.http.cors=true
quarkus.http.cors.origins=*
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=Content-Type,Authorization

# GraphQL Configuration
quarkus.smallrye-graphql.root-path=/api/graphql
quarkus.smallrye-graphql.ui.always-include=true
quarkus.smallrye-graphql.ui.path=/api/graphql-ui
quarkus.smallrye-graphql.error-extension-fields=exception,classification,code,description
quarkus.smallrye-graphql.events.enabled=true

# Database Configuration (Trino)
quarkus.datasource.db-kind=trino
quarkus.datasource.username=trino
quarkus.datasource.password=trino
quarkus.datasource.jdbc.url=jdbc:trino://localhost:8080/iceberg/default
quarkus.datasource.jdbc.driver=io.trino.jdbc.TrinoDriver

# Connection Pool Configuration
quarkus.datasource.agroal.max-size=20
quarkus.datasource.agroal.min-size=5
quarkus.datasource.agroal.initial-size=5
quarkus.datasource.agroal.acquisition-timeout=5s
quarkus.datasource.agroal.connection-timeout=30s
quarkus.datasource.agroal.validation-timeout=5s
quarkus.datasource.agroal.leak-detection-interval=60s

# Health Check Configuration
quarkus.smallrye-health.root-path=/api/health
quarkus.smallrye-health.liveness-path=/api/health/live
quarkus.smallrye-health.readiness-path=/api/health/ready

# Metrics Configuration
quarkus.micrometer.enabled=true
quarkus.micrometer.registry-enabled-default=true
quarkus.micrometer.binder-enabled-default=true
quarkus.micrometer.export.prometheus.enabled=true
quarkus.micrometer.export.prometheus.path=/api/metrics

# Logging Configuration
quarkus.log.level=INFO
quarkus.log.category."com.dataservice".level=DEBUG
quarkus.log.category."io.quarkus.runtime".level=INFO

# Custom Configuration
trino.catalog=iceberg
trino.schema=default
trino.server-url=http://localhost:8080
trino.query-timeout=300
trino.max-rows=10000

# Development Configuration
quarkus.live-reload.password=changeit
quarkus.live-reload.url=http://localhost:8080 