# Quarkus Test Configuration

# Use H2 in-memory database for tests
quarkus.datasource.db-kind=h2
quarkus.datasource.username=sa
quarkus.datasource.password=
quarkus.datasource.jdbc.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
quarkus.datasource.jdbc.driver=org.h2.Driver

# GraphQL Configuration for tests
quarkus.smallrye-graphql.root-path=/api/graphql
quarkus.smallrye-graphql.ui.always-include=true

# Health Check Configuration for tests
quarkus.smallrye-health.root-path=/api/health

# Logging Configuration for tests
quarkus.log.level=INFO
quarkus.log.category."com.dataservice".level=DEBUG

# Custom Configuration for tests
trino.catalog=iceberg
trino.schema=default
trino.server-url=http://localhost:8080
trino.query-timeout=300
trino.max-rows=10000 